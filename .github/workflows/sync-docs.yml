name: Sync product sheets to pressone-docs

# Copies product_sheets/ and the shared CSS/logos into
# shripald/pressone-docs/products/ so Cloudflare Pages redeploys docs.pressone.net.
on:
  push:
    branches: [main]
    paths:
      - "product_sheets/**"
      - "colors_and_type.css"
      - "assets/**"
      - "scripts/sync_to_docs.py"
      - ".github/workflows/sync-docs.yml"
  workflow_dispatch: {}

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out p1design
        uses: actions/checkout@v4
        with:
          path: p1design

      - name: Check token
        env:
          TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret DOCS_REPO_TOKEN is not set. Add a token with Contents: read & write on shripald/pressone-docs."
            exit 1
          fi

      - name: Check out pressone-docs
        uses: actions/checkout@v4
        with:
          repository: shripald/pressone-docs
          ref: main
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: pressone-docs

      - name: Copy sheets into products/
        run: python3 p1design/scripts/sync_to_docs.py p1design pressone-docs

      - name: Commit and push
        working-directory: pressone-docs
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "pressone-docs is already up to date."
            exit 0
          fi
          git config user.name "p1design sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A products
          SUBJECT=$(printf '%s' "${SRC_MSG:-manual sync}" | head -n1)
          git commit -m "Sync product sheets from p1design@${SRC_SHA::7}" -m "$SUBJECT"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing on latest main"
            git pull --rebase origin main || { echo "::error::Rebase conflict in pressone-docs; sync by hand"; exit 1; }
          done
          echo "::error::Could not push to pressone-docs after 3 attempts"
          exit 1
