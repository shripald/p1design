<!doctype html>
<html><head><meta charset="utf-8"><title>Brand colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 18px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .swatch-block {
    height: 96px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 12px 14px;
    color: white;
    box-shadow: 0 1px 2px rgba(42,14,69,.08);
    position: relative;
  }
  .name { font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }
  .hex  { font-family: var(--font-mono); font-size: 11.5px; opacity: 0.88; margin-top: 2px; }
  .tag  {
    position: absolute; top: 10px; right: 12px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    background: rgba(255,255,255,0.18); padding: 3px 7px; border-radius: 999px;
  }
</style>
</head>
<body><main class="card">
  <div class="grid">
    <div class="swatch-block" style="background: var(--p1-purple-800);">
      <span class="tag">Brand</span>
      <span class="name">Purple 800</span>
      <span class="hex">#45166A · --p1-purple-800</span>
    </div>
    <div class="swatch-block" style="background: var(--p1-orange-600);">
      <span class="tag">CTA</span>
      <span class="name">Orange 600</span>
      <span class="hex">#FF8200 · --p1-orange-600</span>
    </div>
    <div class="swatch-block" style="background: var(--p1-purple-900);">
      <span class="name">Purple 900</span>
      <span class="hex">#2A0E45 · --p1-purple-900</span>
    </div>
    <div class="swatch-block" style="background: var(--p1-orange-500); color:#3a1e00;">
      <span class="name">Orange 500</span>
      <span class="hex">#FAA633 · --p1-orange-500</span>
    </div>
  </div>
</main></body></html>
