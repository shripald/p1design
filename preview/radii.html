<!doctype html>
<html><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 14px; justify-content: center; }
  .row { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .tile {
    width: 76px; height: 76px;
    background: var(--p1-purple-100);
    border: 1px solid var(--p1-purple-400);
    display: flex; align-items: center; justify-content: center;
    color: var(--p1-purple-800); font-weight: 700; font-size: 14px;
  }
  .col { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="row">
    <div class="col"><div class="tile" style="border-radius: 4px;">4</div><span class="meta">--radius-xs</span></div>
    <div class="col"><div class="tile" style="border-radius: 6px;">6</div><span class="meta">--radius-sm</span></div>
    <div class="col"><div class="tile" style="border-radius: 10px;">10</div><span class="meta">--radius-md</span></div>
    <div class="col"><div class="tile" style="border-radius: 16px;">16</div><span class="meta">--radius-lg</span></div>
    <div class="col"><div class="tile" style="border-radius: 24px;">24</div><span class="meta">--radius-xl</span></div>
    <div class="col"><div class="tile" style="border-radius: 999px;">∞</div><span class="meta">--radius-pill</span></div>
  </div>
</main></body></html>
