<!doctype html>
<html><head><meta charset="utf-8"><title>Purple scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 14px; }
  .ramp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .step {
    aspect-ratio: 1 / 1.15;
    border-radius: 10px;
    padding: 10px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 2px rgba(42,14,69,.06);
  }
  .step .num { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .step .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .heading { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="heading">Purple ramp</div>
  <div class="ramp">
    <div class="step" style="background: var(--p1-purple-50); color: var(--p1-purple-900);">
      <span class="num">50</span><span class="hex">F8F4FB</span>
    </div>
    <div class="step" style="background: var(--p1-purple-100); color: var(--p1-purple-900);">
      <span class="num">100</span><span class="hex">EFE6F6</span>
    </div>
    <div class="step" style="background: var(--p1-purple-400); color: white;">
      <span class="num">400</span><span class="hex">AE8CC8</span>
    </div>
    <div class="step" style="background: var(--p1-purple-600); color: white;">
      <span class="num">600</span><span class="hex">8154A4</span>
    </div>
    <div class="step" style="background: var(--p1-purple-800); color: white;">
      <span class="num">800</span><span class="hex">45166A</span>
    </div>
    <div class="step" style="background: var(--p1-purple-900); color: white;">
      <span class="num">900</span><span class="hex">2A0E45</span>
    </div>
  </div>
</main></body></html>
