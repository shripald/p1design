<!doctype html>
<html><head><meta charset="utf-8"><title>Logo — mark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 24px; justify-content: center; align-items: center; flex-direction: row; background: white;}
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px;}
  .col img { height: 96px; width: 96px; }
  .col.small img { height: 48px; width: 48px; }
  .col.tiny img  { height: 24px; width: 24px; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="col"><img src="../assets/pressone-mark.svg" alt="mark"><span class="meta">96 px</span></div>
  <div class="col small"><img src="../assets/pressone-mark.svg" alt="mark"><span class="meta">48 px</span></div>
  <div class="col tiny"><img src="../assets/pressone-mark.svg" alt="mark"><span class="meta">24 px · favicon</span></div>
</main></body></html>
