<!doctype html>
<html><head><meta charset="utf-8"><title>Hero CTA in context</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; gap: 0; background: var(--p1-purple-900); color: white; justify-content: center; align-items: flex-start; padding: 32px 36px;}
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--p1-orange-500); margin-bottom: 10px;}
  h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; color: white; margin: 0 0 12px; max-width: 520px;}
  h1 em { font-style: normal; color: var(--p1-orange-500);}
  p { font-size: 15.5px; color: rgba(255,255,255,0.78); max-width: 480px; line-height: 1.6; margin: 0 0 18px;}
  .ctas { display: flex; gap: 10px; align-items: center;}
  .btn-primary {
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 12px 22px; border-radius: 999px; border: 0;
    background: var(--p1-orange-600); color: white;
    box-shadow: 0 10px 24px rgba(255,130,0,0.4);
  }
  .btn-ghost {
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 20px; border-radius: 999px;
    background: transparent; color: white;
    border: 2px solid rgba(255,255,255,0.4);
  }
</style>
</head>
<body><main class="card">
  <span class="eyebrow">Unified Communications</span>
  <h1>For better <em>communications.</em></h1>
  <p>Hosted VoIP, AI auto-attendants, omnichannel contact center — and a real person on the phone when you need one.</p>
  <div class="ctas"><button class="btn-primary">Request a Demo</button><button class="btn-ghost">See Plans</button></div>
</main></body></html>
