<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Eyebrow & UI</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 18px; justify-content: center; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
  }
  .label {
    font-size: 13px; font-weight: 600; color: var(--fg1); letter-spacing: 0.01em;
  }
  .btn-label {
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    color: white; background: var(--p1-orange-600);
    padding: 10px 22px; border-radius: 999px; display: inline-block;
  }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="col">
    <span class="eyebrow">Unified Communications</span>
    <span class="meta">eyebrow · 12/700 · tracking +0.14em · accent color</span>
  </div>
  <div class="col">
    <span class="label">Business phone number</span>
    <span class="meta">UI label · 13/600 · fg1</span>
  </div>
  <div class="row">
    <span class="btn-label">Request a Demo</span>
    <span class="meta">Button label · 14/700 · tracking +0.06em · UPPER</span>
  </div>
</main></body></html>
