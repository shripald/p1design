<!doctype html>
<html><head><meta charset="utf-8"><title>Card — feature</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 16px; background: var(--bg-tint); justify-content: center;}
  .feature {
    background: white; border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 20px rgba(42,14,69,0.10);
    max-width: 420px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .icon {
    width: 52px; height: 52px;
    background: var(--brand-soft);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--p1-orange-600);
  }
  h3 { font-size: 20px; font-weight: 700; color: var(--p1-purple-800); margin: 0; letter-spacing: -0.01em;}
  p { font-size: 14.5px; line-height: 1.6; color: var(--fg3); margin: 0; }
  a.cta {
    margin-top: 4px;
    font-weight: 700; color: var(--p1-orange-600);
    text-decoration: none; letter-spacing: 0.01em; font-size: 14px;
  }
</style>
</head>
<body><main class="card">
  <div class="feature">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </div>
    <h3>AI auto-attendant</h3>
    <p>Give callers that personal touch — even when you're busy or understaffed — with our incredibly lifelike AI auto-attendant.</p>
    <a class="cta" href="#">Learn more →</a>
  </div>
</main></body></html>
