<!doctype html>
<html><head><meta charset="utf-8"><title>Orange scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 14px; }
  .ramp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .step {
    aspect-ratio: 1 / 1.15;
    border-radius: 10px;
    padding: 10px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 2px rgba(42,14,69,.06);
  }
  .step .num { font-weight: 700; font-size: 13px; }
  .step .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.85; }
  .heading { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="heading">Orange ramp</div>
  <div class="ramp">
    <div class="step" style="background: var(--p1-orange-50); color: #5a2d00;">
      <span class="num">50</span><span class="hex">FFF4E6</span>
    </div>
    <div class="step" style="background: var(--p1-orange-200); color: #5a2d00;">
      <span class="num">200</span><span class="hex">FFD9A8</span>
    </div>
    <div class="step" style="background: var(--p1-orange-500); color: #3a1e00;">
      <span class="num">500</span><span class="hex">FAA633</span>
    </div>
    <div class="step" style="background: var(--p1-orange-600); color: white;">
      <span class="num">600</span><span class="hex">FF8200</span>
    </div>
    <div class="step" style="background: var(--p1-orange-700); color: white;">
      <span class="num">700</span><span class="hex">E06A00</span>
    </div>
  </div>
</main></body></html>
