<!doctype html>
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 14px; justify-content: center; }
  .field { display: flex; flex-direction: column; gap: 6px; max-width: 360px;}
  label { font-size: 13px; font-weight: 600; color: var(--fg1); }
  input, select, textarea {
    font-family: inherit; font-size: 14px; color: var(--fg1);
    padding: 11px 14px;
    border: 1.5px solid var(--p1-ink-200);
    border-radius: 6px;
    background: white;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--p1-purple-600);
    box-shadow: 0 0 0 3px rgba(255,179,71,0.4);
  }
  .help { font-size: 12px; color: var(--fg3); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style>
</head>
<body><main class="card">
  <div class="row">
    <div class="field">
      <label for="a">Business email</label>
      <input id="a" type="email" placeholder="name@company.com" value="rebecca@northwind-hotels.com">
      <span class="help">We'll use this to send your demo link.</span>
    </div>
    <div class="field">
      <label for="b">Team size</label>
      <select id="b">
        <option>10–25 employees</option>
        <option>25–100 employees</option>
      </select>
      <span class="help">Focused on your fit.</span>
    </div>
  </div>
</main></body></html>
