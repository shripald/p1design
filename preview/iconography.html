<style>
  .card { padding: 28px; gap: 16px; justify-content: center;}
  .grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px;
    color: var(--p1-purple-800);
  }
  .grid svg { width: 28px; height: 28px; }
  .grid > div { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; background: var(--bg-tint); border-radius: 10px; transition: background 150ms; }
  .grid > div:hover { background: var(--p1-orange-50); color: var(--p1-orange-600); }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); text-align: center;}
</style>
