<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Headings</title>
<link rel="stylesheet" href="../colors_and_type.css">

  <div class="row"><h1>Hosted VoIP that just works.</h1><span class="meta">h1 · 48/700</span></div>

  <div class="row"><h3>One platform. Every channel.</h3><span class="meta">h3 · 28/600</span></div>
