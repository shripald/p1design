<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 8px; justify-content: center; }
  .row { display: flex; align-items: center; gap: 14px; }
  .label { width: 70px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .bar { height: 14px; background: var(--p1-purple-600); border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="row"><span class="label">space-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="label">space-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="label">space-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
  <div class="row"><span class="label">space-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
  <div class="row"><span class="label">space-6</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
  <div class="row"><span class="label">space-8</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
  <div class="row"><span class="label">space-12</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
  <div class="row"><span class="label">space-16</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
  <div class="row"><span class="label">space-20</span><div class="bar" style="width:80px"></div><span class="px">80</span></div>
  <div class="row"><span class="label">space-24</span><div class="bar" style="width:96px"></div><span class="px">96</span></div>
</main></body></html>
