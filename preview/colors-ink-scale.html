<!doctype html>
<html><head><meta charset="utf-8"><title>Ink (neutral) scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 14px; }
  .ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .step {
    aspect-ratio: 1 / 1.15;
    border-radius: 10px;
    padding: 8px 10px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 2px rgba(42,14,69,.06);
    border: 1px solid rgba(0,0,0,.04);
  }
  .step .num { font-weight: 700; font-size: 12.5px; }
  .step .hex { font-family: var(--font-mono); font-size: 9.5px; opacity: 0.8; }
  .heading { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="heading">Ink — neutrals</div>
  <div class="ramp">
    <div class="step" style="background: #FFF; color: var(--p1-ink-900);"><span class="num">0</span><span class="hex">FFFFFF</span></div>
    <div class="step" style="background: var(--p1-ink-50); color: var(--p1-ink-900);"><span class="num">50</span><span class="hex">F6F6F6</span></div>
    <div class="step" style="background: var(--p1-ink-100); color: var(--p1-ink-900);"><span class="num">100</span><span class="hex">ECECEC</span></div>
    <div class="step" style="background: var(--p1-ink-200); color: var(--p1-ink-900);"><span class="num">200</span><span class="hex">D9D9D9</span></div>
    <div class="step" style="background: var(--p1-ink-400); color: #fff;"><span class="num">400</span><span class="hex">9B9B9B</span></div>
    <div class="step" style="background: var(--p1-ink-600); color: #fff;"><span class="num">600</span><span class="hex">5B5B5B</span></div>
    <div class="step" style="background: var(--p1-ink-800); color: #fff;"><span class="num">800</span><span class="hex">363636</span></div>
  </div>
</main></body></html>
