<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 16px; justify-content: center; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  button {
    font-family: inherit; cursor: pointer;
    font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 12px 24px; border-radius: 999px; border: 2px solid transparent;
    transition: all 180ms cubic-bezier(0.2,0.7,0.2,1);
  }
  .btn-primary {
    background: var(--p1-orange-600); color: white;
    box-shadow: 0 8px 18px rgba(255,130,0,0.32);
  }
  .btn-primary:hover { background: var(--p1-orange-700); box-shadow: 0 12px 24px rgba(255,130,0,0.40); transform: translateY(-1px);}
  .btn-secondary {
    background: var(--p1-purple-800); color: white;
  }
  .btn-secondary:hover { background: var(--p1-purple-900); }
  .btn-ghost {
    background: transparent; color: var(--p1-purple-800);
    border-color: var(--p1-purple-800);
  }
  .btn-ghost:hover { background: var(--brand-soft); }
  .btn-link {
    background: none; border: none; border-radius: 0; padding: 6px 2px;
    color: var(--p1-purple-600); text-transform: none; letter-spacing: 0.01em;
    font-weight: 600; font-size: 14px;
  }
  .btn-link:hover { color: var(--p1-orange-600); }
  .label { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="row">
    <button class="btn-primary">Request a Demo</button>
    <button class="btn-secondary">Learn More</button>
    <button class="btn-ghost">Contact Sales</button>
    <button class="btn-link">See features →</button>
  </div>
  <div class="row">
    <span class="label">Primary (CTA)</span>
    <span class="label" style="margin-left:30px">Secondary</span>
    <span class="label" style="margin-left:30px">Ghost</span>
    <span class="label" style="margin-left:30px">Link</span>
  </div>
</main></body></html>
