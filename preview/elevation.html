<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation / shadow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px 24px; gap: 24px; justify-content: center; background: var(--bg-tint);}
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tile {
    width: 96px; height: 64px;
    background: white;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--fg1); font-size: 13px;
  }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg4); }
</style>
</head>
<body><main class="card">
  <div class="row">
    <div class="col"><div class="tile" style="box-shadow: var(--shadow-xs);">xs</div><span class="meta">--shadow-xs</span></div>
    <div class="col"><div class="tile" style="box-shadow: var(--shadow-sm);">sm</div><span class="meta">--shadow-sm</span></div>
    <div class="col"><div class="tile" style="box-shadow: var(--shadow-md);">md</div><span class="meta">--shadow-md</span></div>
    <div class="col"><div class="tile" style="box-shadow: var(--shadow-lg);">lg</div><span class="meta">--shadow-lg</span></div>
    <div class="col"><div class="tile" style="box-shadow: var(--shadow-cta); background: var(--p1-orange-600); color: white;">cta</div><span class="meta">--shadow-cta</span></div>
  </div>
</main></body></html>
