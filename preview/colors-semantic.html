<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; gap: 12px; }
  .row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: white;
  }
  .dot { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
  .meta { display: flex; flex-direction: column; gap: 1px; min-width: 0;}
  .name { font-weight: 600; font-size: 13px; color: var(--fg1); }
  .var  { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }
</style>
</head>
<body><main class="card">
  <div class="row2">
    <div class="item"><div class="dot" style="background: var(--accent);"></div><div class="meta"><span class="name">Accent / CTA</span><span class="var">--accent · #FF8200</span></div></div>
    <div class="item"><div class="dot" style="background: var(--brand);"></div><div class="meta"><span class="name">Brand</span><span class="var">--brand · #45166A</span></div></div>
    <div class="item"><div class="dot" style="background: var(--link);"></div><div class="meta"><span class="name">Link</span><span class="var">--link · #8154A4</span></div></div>
    <div class="item"><div class="dot" style="background: var(--focus-ring);"></div><div class="meta"><span class="name">Focus ring</span><span class="var">--focus-ring · #FFB347</span></div></div>
    <div class="item"><div class="dot" style="background: var(--success);"></div><div class="meta"><span class="name">Success</span><span class="var">--success · #2F8F4F</span></div></div>
    <div class="item"><div class="dot" style="background: var(--warning);"></div><div class="meta"><span class="name">Warning</span><span class="var">--warning · #E0A100</span></div></div>
    <div class="item"><div class="dot" style="background: var(--danger);"></div><div class="meta"><span class="name">Danger</span><span class="var">--danger · #C8331C</span></div></div>
    <div class="item"><div class="dot" style="background: var(--bg-tint); box-shadow: inset 0 0 0 1px var(--border);"></div><div class="meta"><span class="name">Surface tint</span><span class="var">--bg-tint · #F8F4FB</span></div></div>
  </div>
</main></body></html>
